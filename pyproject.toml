[project]
name = "business-analytics-portfolio"
version = "0.1.0"
description = "Business analytics portfolio: financial modeling, forecasting, and data analysis coursework projects"
authors = [
    { name = "Miguel L. Ferguson II", email = "your_email@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "jupyter>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
