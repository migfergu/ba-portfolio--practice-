[project]
name = "business-analytics-portfolio"
version = "0.1.0"
description = "Business analytics portfolio: financial modeling, forecasting, and data analysis coursework projects"
authors = [
    { name = "Miguel L. Ferguson II", email = "miguelferguson38@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "jupyter>=1.0.0",
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
oews-pipeline = "oews_pipeline.cli:main"
oews-eda = "oews_eda.__main__:main"
oews-model = "oews_model.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "src/oews_pipeline", "src/oews_eda", "src/oews_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
